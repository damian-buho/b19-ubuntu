    concurrency:
      group: publish-${{ github.repository }}-${{ toJSON(matrix) }}
      cancel-in-progress: false
    strategy:
      matrix:
        B19_UBUNTU_SERIES: ["resolute", "noble"]
        M6E_PUBLISH_SINK: ["ghcr"]
    env:
      B19_UBUNTU_SERIES: ${{ matrix.B19_UBUNTU_SERIES }}
      M6E_IMAGE_FULLNAME: b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}-${{ github.run_id }}-amd64
      M6E_COMPOSE_PROJECT_NAME: ci-b19-ubuntu-${{ matrix.B19_UBUNTU_SERIES }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
      M6E_CONTAINER_INSTANCE: ci-b19-ubuntu-${{ matrix.B19_UBUNTU_SERIES }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKERHUB_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_REGISTRY_PASSWORD }}
      DOCKERHUB_REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.B19_UBUNTU_SERIES }}-amd64-${{ github.run_id }}
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.B19_UBUNTU_SERIES }}-arm64-${{ github.run_id }}
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.B19_UBUNTU_SERIES }}-riscv64-${{ github.run_id }}
      - run: docker load --input image-${{ matrix.B19_UBUNTU_SERIES }}-amd64-${{ github.run_id }}.tar
      - name: secrets-provision
        uses: projectfile/ci-actions/secrets-provision@v1
        with:
          declarations: "{\"b19.test.secret\":{\"value\":\"hello-from-shell-d\"}}"
          dir: .secrets
          default-image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools:{1}', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho', env.M6E_TAG) }}
          image: b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:${{ env.M6E_TAG }}-${{ github.run_id }}-amd64
      - name: oci-push
        # This cell's destination gate — on the STEP because a job `if:` may not read
        # the matrix context, and a forge rejects the whole file when one does.
        if: vars.CI_PUBLISH_SINKS == '' || contains(format(',{0},', vars.CI_PUBLISH_SINKS), format(',{0},', matrix.M6E_PUBLISH_SINK))
        uses: projectfile/ci-actions/oci-push@v1
        with:
          # One tar per DECLARED architecture, published together as a manifest list at
          # each cascade tag. Per-arch TAGS are deliberately not published: they are
          # scaffolding, and a registry that cannot delete a tag keeps them forever.
          archives: |
            amd64 image-${{ matrix.B19_UBUNTU_SERIES }}-amd64-${{ github.run_id }}
            arm64 image-${{ matrix.B19_UBUNTU_SERIES }}-arm64-${{ github.run_id }}
            riscv64 image-${{ matrix.B19_UBUNTU_SERIES }}-riscv64-${{ github.run_id }}
          image: b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:${{ env.M6E_TAG }}-${{ github.run_id }}
          version: ${{ github.ref_name }}
          # OUTPUT_REGISTRY: the forge-dependent PUSH target (kiota.ch / ghcr.io / …),
          # always threaded — empty => Docker Hub. NOT the per-namespace INPUT registries
          # (B19_DOCKER_REGISTRY & friends answer "where base images come FROM"); this
          # answers "where THIS project publishes TO". Set per forge (org var = default,
          # repo var = project-wise override). Ignored when `refs` below is present.
          registry: ${{ vars.OUTPUT_REGISTRY }}
          # Every destination this forge's route declares, each reference composed by
          # the sink that declared it — so one archive lands under whatever path grammar
          # each registry wants. Credentials key on the SINK name.
          refs: |
            ghcr ghcr.io/damian-buho/b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:latest
          # This CELL's destination, off the publish axis: the job runs one cell per
          # place the archive goes, so a registry refusing a push fails only its own.
          sink: ${{ matrix.M6E_PUBLISH_SINK }}
      # Reap the run-scoped image tag AND the live stack's network. Both are unique per
      # run (the tag carries M6E_RUN_SCOPE, the network the run-scoped project name), so
      # without this the runner's docker store gains one image per run forever AND a
      # failed/timed-out `up` can orphan the network (compose reports the removal error
      # WITHOUT failing). RmiImage and RmNetwork are always PAIRED (single assignment
      # site), so one docker-cleanup step reaps both — the imperative reaps + their
      # `inspect` guard live in the pinned action, not inline (Law 2).
      - if: ${{ always() }}
        uses: projectfile/ci-actions/docker-cleanup@v1
        with:
          image: b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:${{ env.M6E_TAG }}-${{ github.run_id }}-amd64
          network: ci-b19-ubuntu-${{ matrix.B19_UBUNTU_SERIES }}-amd64-${{ env.M6E_RUN_SCOPE }}-network
  published:
    runs-on: ubuntu-latest
    needs: ["publish-image", "ready-to-publish"]
    steps:
      - run: echo published
  ready-to-publish:
    runs-on: ubuntu-latest
    needs: ["artifact-ready", "documentation-is-ready", "image-is-ready", "source-is-compliant", "source-is-secure"]
    steps:
      - run: echo ready-to-publish
  secrets-ready:
    runs-on: ubuntu-latest
    needs: ["image-is-built"]
    steps:
      - run: echo secrets-ready
  source-is-compliant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: i18n-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-i18n check
      - name: reuse-lint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_PYTHON_TOOLS_IMAGE || format('{0}/d9t/python-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: reuse lint
  source-is-ready:
    runs-on: ubuntu-latest
    needs: ["fetched", "projectfile-is-synced", "source-is-tested", "source-passes-lint"]
    steps:
      - run: echo source-is-ready
  source-is-secure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: restore grype-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/grype-db
          key: ci-cache-grype-db-
          restore-keys: |
            ci-cache-grype-db-
      - name: grype-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-grype
          mounts: ${{ runner.temp }}/ci-cache/grype-db:/app/.cache/grype:ro
      - name: restore trivy-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-
          restore-keys: |
            ci-cache-trivy-db-
      - name: trivy-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE || format('{0}/d9t/go-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-trivy fs
          env: |-
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/ci-cache/trivy-db:/app/.cache/trivy:ro
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: reports-source-is-secure-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
  source-is-tested:
    runs-on: ubuntu-latest
    steps:
      - run: echo source-is-tested
  source-passes-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: cffr-validate
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_R_TOOLS_IMAGE || format('{0}/d9t/r-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-cffr-validate
      - name: hadolint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.HADOLINT_IMAGE || 'hadolint/hadolint' }}
          version: v2.15.1
          pull: missing
          run: hadolint Dockerfile
      - name: ignorelint-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_IGNORELINT_IMAGE || format('{0}/d9t/ignorelint', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: ignorelint
      - name: jsonlint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_JS_TOOLS_IMAGE || format('{0}/d9t/js-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-jsonlint
      - name: shellcheck
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-shellcheck
      - name: yamllint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_PYTHON_TOOLS_IMAGE || format('{0}/d9t/python-tools', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho') }}
          version: ${{ env.M6E_TAG }}
          run: auto-yamllint
