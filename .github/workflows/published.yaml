      M6E_ARCH: ${{ matrix.M6E_ARCH }}
      M6E_NAMESPACE: b19
      M6E_PROJECT: ubuntu
      B19_COLOR: ${{ inputs.B19_COLOR || vars.B19_COLOR || '1' }}
      B19_FD_IMAGE: ${{ vars.B19_DOCKER_REGISTRY }}/b19/fd:${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
      B19_FETCH_DOCKER_CACHE: ${{ inputs.B19_FETCH_DOCKER_CACHE || vars.B19_FETCH_DOCKER_CACHE || 'Y' }}
      B19_FETCH_LOCAL_CACHE: ${{ inputs.B19_FETCH_LOCAL_CACHE || vars.B19_FETCH_LOCAL_CACHE || 'Y' }}
      B19_LOCALES: ${{ inputs.B19_LOCALES || vars.B19_LOCALES }}
      B19_MINIJINJA_IMAGE: ${{ vars.B19_DOCKER_REGISTRY }}/b19/minijinja:${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
      B19_OFFGRID_MODE: ${{ inputs.B19_OFFGRID_MODE || vars.B19_OFFGRID_MODE || 'N' }}
