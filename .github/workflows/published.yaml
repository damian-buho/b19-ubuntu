          default-image: ${{ vars.D9T_MISC_TOOLS_IMAGE || format('{0}/d9t/misc-tools:{1}', vars.SOURCE_DOCKER_REGISTRY || 'ghcr.io/damian-buho', env.M6E_TAG) }}
