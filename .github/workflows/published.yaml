          - M6E_ARCH: "amd64"
            M6E_RUNNER: "ubuntu-latest"
    env:
      B19_UBUNTU_SERIES: ${{ matrix.B19_UBUNTU_SERIES }}
      M6E_ARCH: ${{ matrix.M6E_ARCH }}
      M6E_IMAGE_FULLNAME: b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}-${{ github.run_id }}-${{ matrix.M6E_ARCH }}
      M6E_COMPOSE_PROJECT_NAME: ci-b19-ubuntu-${{ matrix.B19_UBUNTU_SERIES }}-${{ matrix.M6E_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
      M6E_CONTAINER_INSTANCE: ci-b19-ubuntu-${{ matrix.B19_UBUNTU_SERIES }}-${{ matrix.M6E_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/download-artifact@v8
        with:
