name: audited
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
env:
  M6E_TAG: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
  M6E_RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  audited:
    runs-on: ubuntu-latest
    needs: ["image-is-audited", "source-is-audited"]
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule')
    steps:
      - run: echo audited
  image-is-audited:
    runs-on: ${{ matrix.M6E_RUNNER }}
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule')
    strategy:
      matrix:
        B19_UBUNTU_SERIES: ["resolute", "noble"]
        M6E_ARCH: ["amd64", "arm64", "riscv64"]
        include:
          - M6E_ARCH: "amd64"
            M6E_RUNNER: "ubuntu-latest"
          - M6E_ARCH: "arm64"
            M6E_RUNNER: "ubuntu-24.04-arm"
          - M6E_ARCH: "riscv64"
            M6E_RUNNER: "ubuntu-26.04-riscv"
    env:
      B19_UBUNTU_SERIES: ${{ matrix.B19_UBUNTU_SERIES }}
      M6E_ARCH: ${{ matrix.M6E_ARCH }}
      M6E_IMAGE_PUBLISHED: ghcr.io/damian-buho/b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: restore grype-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/grype-db
          key: ci-cache-grype-db-
          restore-keys: |
            ci-cache-grype-db-
      - name: grype-scan-registry
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE }}
          version: ${{ env.M6E_TAG }}
          run: auto-grype image
          env: |-
            B19_UBUNTU_SERIES=${{ matrix.B19_UBUNTU_SERIES }}
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            M6E_IMAGE_PUBLISHED=ghcr.io/damian-buho/b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:latest
          mounts: ${{ runner.temp }}/ci-cache/grype-db:/app/.cache/grype:ro
      - name: restore trivy-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/trivy-db
          key: ci-cache-trivy-db-
          restore-keys: |
            ci-cache-trivy-db-
      - name: trivy-scan-registry
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_GO_TOOLS_IMAGE }}
          version: ${{ env.M6E_TAG }}
          run: auto-trivy image
          env: |-
            B19_UBUNTU_SERIES=${{ matrix.B19_UBUNTU_SERIES }}
            M6E_ARCH=${{ matrix.M6E_ARCH }}
            M6E_IMAGE_PUBLISHED=ghcr.io/damian-buho/b19/ubuntu/${{ matrix.B19_UBUNTU_SERIES }}:latest
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/ci-cache/trivy-db:/app/.cache/trivy:ro
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: reports-image-is-audited-${{ matrix.B19_UBUNTU_SERIES }}-${{ matrix.M6E_ARCH }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
  source-is-audited:
    runs-on: ubuntu-latest
    needs: ["source-is-secure"]
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule')
    steps:
      - run: echo source-is-audited
  source-is-secure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: restore grype-db
