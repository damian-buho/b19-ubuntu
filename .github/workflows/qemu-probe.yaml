# THROWAWAY probe — not generated by pf-ci, delete with this branch.
---
name: qemu-probe
"on":
  push:
    branches: ["chore/qemu-probe"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  riscv64-on-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: host facts before any install
        run: |
          uname -m                                          # the runner's native arch
          docker version --format 'docker={{.Server.Version}}'
          ls /proc/sys/fs/binfmt_misc/ || echo 'binfmt_misc NOT mounted here'
          cat /proc/sys/fs/binfmt_misc/status || true       # the sentinel platform.sh probes
      - name: install the riscv64 handler
        run: |
          docker run --privileged --rm \
            tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 \
            --install riscv64
      - name: handler is registered with the F flag
        run: |
          ls /proc/sys/fs/binfmt_misc/
          cat /proc/sys/fs/binfmt_misc/qemu-riscv64         # F flag is what reaches into containers
      - name: a riscv64 container executes
        run: docker run --rm --platform linux/riscv64 ubuntu:24.04 uname -m
      - name: buildx builds riscv64 through the docker-container driver
        run: |
          mkdir --parents /tmp/probe
          printf '%s\n' \
            'FROM ubuntu:24.04' \
            'RUN uname -m && apt-get update && apt-get install --yes --no-install-recommends ca-certificates' \
            > /tmp/probe/Dockerfile
          docker buildx create --name probe --driver docker-container --use
          docker buildx build --platform linux/riscv64 \
            --output type=docker,dest=/tmp/probe/image.tar /tmp/probe
      - name: the archive is one riscv64 image
        run: |
          ls -la /tmp/probe/image.tar
          docker load --input /tmp/probe/image.tar          # single-image docker-archive, as the scanners need
          docker image inspect --format '{{.Architecture}}' "$(docker images --quiet | head -1)"
