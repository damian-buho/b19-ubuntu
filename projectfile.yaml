org:
  b19:
    scaffold:
      root-stage: base
  projectfile:
    architecture:
      - amd64
      - arm64
      - riscv64
    build:
      args:
        B19_LOCALES: ""
        B19_UBUNTU_HASH:
          file: .container/foundation/deps/ubuntu/{B19_UBUNTU_SERIES}.sha256.deps
        B19_UBUNTU_MIRROR_AMD64: ""
        B19_UBUNTU_MIRROR_ARM64: ""
        B19_UBUNTU_MIRROR_RISCV64: ""
        B19_UBUNTU_SERIES: resolute
    image:
      series: "{B19_UBUNTU_SERIES}"
      path: ${org}/${name}/${series}
      flatpath: ${org}-${name}-${series}
    ci:
      image: b19/ubuntu/{B19_UBUNTU_SERIES}
      matrix:
        axes:
          B19_UBUNTU_SERIES:
            - resolute
            - noble
      secrets:
        b19.test.secret:
          value: hello-from-shell-d
    operating-system:
      - linux
    status: maintained
