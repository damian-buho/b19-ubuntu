// APT performance optimization for container builds

// Parallel downloads per access method (APT 2.4+)
Acquire::Queue-Mode "access";

// HTTP pipelining depth
Acquire::http::Pipeline-Depth "10";

// Tighter timeouts for fast container networks
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::Retries "3";

// Prefer compressed metadata
Acquire::CompressionTypes::Order:: "xz";
Acquire::CompressionTypes::Order:: "lz4";
Acquire::CompressionTypes::Order:: "gz";

// Skip package cache generation (saves I/O)
Dir::Cache::pkgcache "";
Dir::Cache::srcpkgcache "";

// Minimal installs by default
APT::Install-Recommends "false";
APT::Install-Suggests "false";